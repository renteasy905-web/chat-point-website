<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatPoint – Food Delivery in Sindagi</title>
  <meta name="description" content="Fastest food delivery in Sindagi. Live tracking, COD & UPI.">
  <!-- Icons & PWA -->
  <link rel="icon" href="icon-512.jpg">
  <link rel="apple-touch-icon" href="icon-512.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#59FF94">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- AdSense Loader Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3035782856646159"
     crossorigin="anonymous"></script>
  <script data-ad-client="ca-pub-3035782856646159" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

  <!-- Register minimal service worker (required for PWA install on Android Chrome) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

  <style>
    /* ... (all your existing CSS remains exactly the same) ... */
    :root{--bg:#0E0E0E;--accent:#59FF94;--accent2:#32E06A;--text:#F5F5F5;--sub:#BDBDBD}
    *{margin:0;padding:0;box-sizing:border-box}
    html, body{height:100%;margin:0;padding:0}
    body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;
      padding-bottom:100px;
      background:radial-gradient(1400px at 10% 10%,rgba(89,255,148,0.04),transparent 12%),
                  radial-gradient(1000px at 90% 90%,rgba(89,255,148,0.03),transparent 10%),var(--bg);}
    /* ... rest of your CSS ... */
    /* Permanent Fixed Bottom Install Bar */
    #installBar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, rgba(20,20,20,0.95), rgba(15,15,15,0.9));
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(89,255,148,0.15);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
      display: none;
    }
    /* ... rest of install bar CSS ... */
  </style>
</head>
<body>
  <!-- ... all your existing body content ... -->

  <!-- Permanent Bottom Install Bar -->
  <div id="installBar">
    <img src="icon-512.jpg" alt="ChatPoint Icon">
    <div class="info">
      <h3>Install ChatPoint App</h3>
      <p>Add to Home Screen for instant access & faster ordering</p>
    </div>
    <button id="installBtn">Install Now</button>
  </div>

  <!-- PWA Install Script -->
  <script>
    let deferredPrompt;
    const installBar = document.getElementById('installBar');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBar.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBar.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
